
name: Build PaPudian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -o PaPudian_Native_Android_v2.zip -d extracted
          find extracted -name build.gradle.kts -print

      - name: Build debug APK
        run: |
          cd extracted
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaPudian-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
