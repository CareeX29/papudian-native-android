name: Build PaPudian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@d883318d88aefa04a461fda4dbe803a8de9a45fc
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@87ceea60a25ef153a1a867dacdbb3e775efa1b08

      - name: Extract project
        shell: bash
        run: |
          set -eux
          unzip -o PaPudian_Native_Android_v2.zip -d extracted

      - name: Find Android root
        shell: bash
        run: |
          set -eux
          echo "===== FILES ====="
          find extracted -maxdepth 8 -print | head -200

          ROOT=$(find extracted -maxdepth 8 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: No Android project root found."
            exit 1
          fi

          echo "ROOT=$ROOT"
          echo "$ROOT" > /tmp/android_root.txt

      - name: Build APK
        shell: bash
        run: |
          set -eux
          ROOT=$(cat /tmp/android_root.txt)
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@e4d736dabdf3acf0b1ebfc7f8319a5ae85f4d86a
        with:
          name: PaPudian-debug-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
