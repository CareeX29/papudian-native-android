name: Build PaPudian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip Android project
        shell: bash
        run: |
          set -eux
          unzip -o PaPudian_Native_Android_v2.zip -d extracted
          echo "Detected Android project files:"
          find extracted -maxdepth 6 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Build debug APK
        shell: bash
        run: |
          set -eux
          GRADLEW_PATH=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found inside extracted project"
            find extracted -maxdepth 10 -print | head -n 200
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaPudian-debug-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
