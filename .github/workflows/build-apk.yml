name: Build PaPudian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@836282e11ff5e8f849bdb942e818c6550e209c5b
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8b0d2e90aba046a92a332fda045aeea736c962f3

      - name: Extract Android project
        shell: bash
        run: |
          set -eux
          unzip -o PaPudian_Native_Android_v2.zip -d extracted
          echo "===== Android project files ====="
          find extracted -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
            -print

      - name: Build debug APK
        shell: bash
        run: |
          set -eux

          ROOT=$(find extracted -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project root not found"
            find extracted -maxdepth 6 -print | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT"
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@5c8fbbd9379e020d16b6e7d27b22de92919bf159
        with:
          name: PaPudian-debug-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
